name: CI

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"

defaults:
  run:
    working-directory: backend_dev

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src scripts tests/_attribution tests/fakes
      - name: Import boundaries
        run: uv run python scripts/check_imports.py

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest -q -m "not probe and not gpu and not e2e and not manual" --attribution-json attribution-unit-${{ matrix.os }}.json
      - name: Upload attribution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attribution-unit-${{ matrix.os }}
          path: backend_dev/attribution-unit-${{ matrix.os }}.json
          if-no-files-found: warn

  probes:
    name: probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run hosted probes (no collected tests is success)
        shell: bash
        run: |
          set +e
          uv run pytest -q -m "probe and not gpu" --attribution-json attribution-probes-${{ matrix.os }}.json
          result=$?
          if [ "$result" -eq 5 ]; then exit 0; fi
          exit "$result"
      - name: Upload attribution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attribution-probes-${{ matrix.os }}
          path: backend_dev/attribution-probes-${{ matrix.os }}.json
          if-no-files-found: warn

  attribution-report:
    name: attribution-report
    if: always()
    needs: [static, unit, probes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked environment
        working-directory: backend_dev
        run: uv sync --locked
      - name: Download attribution reports
        uses: actions/download-artifact@v8
        with:
          pattern: attribution-*
          path: attribution-inputs
          merge-multiple: true
      - name: Render run summary
        working-directory: backend_dev
        run: |
          uv run python scripts/attribution_report.py ../attribution-summary.md ../attribution-inputs/*.json
          cat ../attribution-summary.md >> "$GITHUB_STEP_SUMMARY"
