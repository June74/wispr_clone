[project]
name = "wispr-clone"
version = "0.1.0"
description = "Local-first voice dictation application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "numpy",
    "pydantic",
    "sounddevice",
    "soxr",
    "pywin32; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
    "pynput; sys_platform == 'win32'",
    "pywebview; sys_platform == 'win32'",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_clone"]

# The installed app (packaging/install_windows.py) needs the page files, not web/tests.
[tool.hatch.build.targets.wheel.force-include]
"web/index.html" = "wispr_clone/web/index.html"
"web/hud.html" = "wispr_clone/web/hud.html"
"web/app.js" = "wispr_clone/web/app.js"
"web/hud.js" = "wispr_clone/web/hud.js"
"web/waveform.js" = "wispr_clone/web/waveform.js"
"web/styles.css" = "wispr_clone/web/styles.css"
"web/lib" = "wispr_clone/web/lib"
"web/assets" = "wispr_clone/web/assets"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests across multiple components",
    "conformance: tests against a shared interface contract",
    "probe: diagnostic environment or dependency probes",
    "adapter: tests for an external-system adapter",
    "windows: tests requiring Windows",
    "gpu: tests requiring a GPU",
    "e2e: end-to-end application tests",
    "manual: checks requiring a human",
    "feature: tests for a user-visible feature",
    "invariant: tests of a required system invariant",
    "quarantine: temporarily quarantined tests with a tracked expiry",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["experiments/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
